<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="100%" height="100%">
  <defs>
    <linearGradient id="hBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111722" />
      <stop offset="100%" stop-color="#080C12" />
    </linearGradient>

    <linearGradient id="hEyeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#00D2EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="hTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 54px;
      letter-spacing: -0.03em;
      fill: url(#hTextGrad);
    }
    .brand-tagline {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.18em;
      fill: #00D2EB;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.08em;
      fill: #10B981;
    }
  </style>

  <!-- Left Icon Tile -->
  <g transform="translate(24, 20)">
    <!-- Squircle Tile -->
    <rect x="0" y="0" width="120" height="120" rx="30" ry="30"
          fill="url(#hBgGrad)"
          stroke="#1E293B"
          stroke-width="1.5" />

    <!-- Eye Contour -->
    <g filter="url(#hGlow)">
      <path d="M 22 60 C 35 34, 85 34, 98 60 C 85 86, 35 86, 22 60 Z"
            fill="none"
            stroke="url(#hEyeGrad)"
            stroke-width="4.5"
            stroke-linecap="round"
            stroke-linejoin="round" />

      <!-- Outer Iris Ring -->
      <circle cx="60" cy="60" r="18"
              fill="#080C14"
              stroke="url(#hEyeGrad)"
              stroke-width="2.5" />

      <!-- Iris Core -->
      <circle cx="60" cy="60" r="12"
              fill="#00D2EB" />

      <!-- Pupil Center -->
      <circle cx="60" cy="60" r="5.5"
              fill="#FFFFFF" />
      
      <circle cx="57" cy="57" r="2"
              fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Top & Bottom Thermal Dots -->
    <circle cx="60" cy="22" r="2.5" fill="#00D2EB" />
    <circle cx="60" cy="98" r="2.5" fill="#10B981" />
  </g>

  <!-- Right Typography Lockup -->
  <g transform="translate(168, 30)">
    <!-- Title -->
    <text x="0" y="52" class="brand-title">Vigil</text>

    <!-- Status Badge -->
    <g transform="translate(138, 16)">
      <rect x="0" y="0" width="68" height="22" rx="6" ry="6" fill="#064E3B" fill-opacity="0.4" stroke="#059669" stroke-width="1" />
      <circle cx="10" cy="11" r="3" fill="#10B981" />
      <text x="18" y="15" class="badge-text">ACTIVE</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="2" y="86" class="brand-tagline">Windows Clamshell &amp; Cooling Guard</text>
  </g>
</svg>
